# simple-ci default configuration — a template, not a working config.
#
# Real host names belong in ~/.config/simple-ci.conf (per machine) or in a
# repo's ./ci/simple-ci.conf (per project). Nothing in this repo names an
# actual host, so a clone works anywhere once one of those exists.
#
# Read order: $CI_CONF, ./ci/simple-ci.conf, ~/.config/simple-ci.conf, then
# this file. Reaching this file means no config was found; `sci` fails with
# "CI_HOST must be set in simple-ci.conf" rather than guessing a host.

# Ordered list of CI hosts to try — first reachable one wins.
# Entry formats:
#   "host:http://url"       — direct HTTP, probe $url/health
#   "host:tunnel:port"      — SSH tunnel to remote port, API via localhost
#
# List a direct entry first and a tunnel entry for the same box second, so a
# host only exposed on the LAN stays reachable from outside it:
# CI_HOSTS=(
#     "buildhost:http://buildhost:8080"
#     "buildhost.example.com:tunnel:8080"
# )

# Used when CI_HOSTS is not defined or no host in it is reachable.
# CI_HOST=buildhost
# CI_SERVER_URL=http://buildhost:8080

CI_REMOTE_SCRIPT=~/src/simple-ci/ci-rsync.sh
